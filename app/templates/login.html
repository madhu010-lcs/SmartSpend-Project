{% extends "base.html" %}
{% block title %}Log in · SmartSpend{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Log in</h1>
  <p class="muted">See where your money went and what next month will cost.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label" for="username">Username</label>
    <input class="form-control mb-3" id="username" name="username" required autofocus>
    <label class="form-label" for="password">Password</label>
    <input class="form-control mb-3" id="password" name="password" type="password" required>
    <button class="btn btn-accent w-100">Log in</button>
  </form>
  <p class="mt-3 mb-0">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</section>
{% endblock %}
