{% extends "base.html" %}
{% block title %}Create account · SmartSpend{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Create your account</h1>
  <p class="muted">Takes ten seconds. No email needed.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label" for="username">Username</label>
    <input class="form-control mb-3" id="username" name="username" minlength="3" required autofocus>
    <label class="form-label" for="password">Password (6+ characters)</label>
    <input class="form-control mb-3" id="password" name="password" type="password" minlength="6" required>
    <button class="btn btn-accent w-100">Create account</button>
  </form>
  <p class="mt-3 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</section>
{% endblock %}
